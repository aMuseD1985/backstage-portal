name: Backstage anlegen (einmalig)

# Einmal von Hand starten: Actions → „Backstage anlegen (einmalig)“ → Run workflow.
# Erzeugt die Backstage-App im Ordner app/ mit dem offiziellen create-app, checkt sie ein und baut danach direkt das erste Release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anlegen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: App erzeugen
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          if [ -d app ]; then echo "app/ gibt es schon – nichts zu tun."; exit 0; fi
          corepack enable
          # Name der App wird abgefragt → per Pipe beantworten; --skip-install, weil wir gleich selbst installieren
          printf 'portal\n' | npx --yes @backstage/create-app@latest --path app --skip-install
          # Fehler bei Yarn: @yarnpkg/core 4.9.2 ist mit einem lokalen Patch-Pfad für "got" veröffentlicht
          # (ENOENT .yarn/patches/got-npm-11.8.2-….patch). Wie in der aktuellen Backstage-Vorlage auf 4.9.1 festlegen.
          node -e "const fs=require('fs'),f='app/package.json',p=JSON.parse(fs.readFileSync(f,'utf8'));p.resolutions={...(p.resolutions||{}),'@yarnpkg/core':'4.9.1'};fs.writeFileSync(f,JSON.stringify(p,null,2)+'\\n')"
          grep -A4 '"resolutions"' app/package.json
          cd app
          yarn install
          echo "Backstage-Version: $(cat backstage.json 2>/dev/null || echo unbekannt)"

      - name: Einchecken
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          if git diff --quiet && [ -z "$(git status --porcelain app)" ]; then echo "nichts einzuchecken"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "feat: Backstage-App angelegt (create-app)"
          git push

      - name: Fehlerausgabe als Annotation (lesbar über die API)
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/log.txt" ] || exit 0
          # Annotationen werden gekürzt – darum: erst die Fehlerzeilen, dann das Ende, in Stücken zu höchstens 3000 Zeichen
          L="$RUNNER_TEMP/log.txt"; C="$RUNNER_TEMP/kurz.txt"
          { echo "== Fehlerzeilen"; sed 's/\x1b\[[0-9;]*m//g' "$L" | grep -E 'YN000[1-9]|YN00[1-9][0-9].*(rror|fail)|[Ee]rror|ERR!|failed|Exit code' | grep -v 'YN0060' | tail -n 25
            echo "== Ende"; sed 's/\x1b\[[0-9;]*m//g' "$L" | tail -n 15; } | cut -c1-300 > "$C"
          n=1; buf=""
          while IFS= read -r line; do
            if [ $(( ${#buf} + ${#line} )) -gt 3000 ] && [ $n -lt 5 ]; then
              echo "::error title=Letzte Ausgabe ${n}::$(printf '%s' "$buf" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; n=$((n+1)); buf=""
            fi
            buf="${buf}${line}"$'\n'
          done < "$C"
          [ -n "$buf" ] && echo "::error title=Letzte Ausgabe ${n}::$(printf '%s' "$buf" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

  bauen:
    needs: anlegen
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    secrets: inherit   # damit das erste Release gleich per SSH ausgerollt werden kann (falls DEPLOY_SSH_* schon da sind)
