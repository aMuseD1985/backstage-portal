name: Backstage bauen

# Baut die App und legt eine fertige Laufzeit als Release ab (backstage-runtime.tar.gz).
# Gebaut wird auf Ubuntu 24.04 – derselben Version wie auf dem Server –, damit native Bausteine passen.
# Danach wird das Release per SSH auf den Server gespielt (Benutzer backstage, nur der Befehl „deploy“ erlaubt).
# Der Server baut nie selbst. Ohne die Secrets DEPLOY_SSH_* wird das Ausrollen übersprungen.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: backstage-build
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Bauen
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          corepack enable
          yarn install --immutable
          yarn tsc
          yarn build:all
          yarn build:backend

      - name: Laufzeit zusammenstellen (ohne Entwicklerpakete)
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          R="$RUNNER_TEMP/runtime"; mkdir -p "$R"
          cp app/package.json app/yarn.lock "$R"/
          [ -f app/.yarnrc.yml ] && cp app/.yarnrc.yml "$R"/
          [ -d app/.yarn ] && cp -r app/.yarn "$R"/
          tar xzf app/packages/backend/dist/skeleton.tar.gz -C "$R"
          # focus passt die yarn.lock nur intern an (ohne sie zu speichern) – dafür die CI-Sperre aufheben
          ( cd "$R" && corepack enable && YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn workspaces focus --all --production )
          tar xzf app/packages/backend/dist/bundle.tar.gz -C "$R"
          cp app/app-config.yaml app/app-config.production.yaml "$R"/
          node --version > "$R"/NODE_VERSION
          git rev-parse --short HEAD > "$R"/COMMIT
          tar czf backstage-runtime.tar.gz -C "$R" .
          ls -lh backstage-runtime.tar.gz

      - name: Release anlegen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          # Lauf-ID statt Laufnummer: die Nummer zählt je Workflow getrennt („anlegen“ und „bauen“ kollidieren), die ID ist eindeutig
          TAG="build-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release create "$TAG" backstage-runtime.tar.gz --title "$TAG" --notes "Gebaut aus $(git rev-parse --short HEAD), Node $(node --version)"
          # nur die letzten 5 Releases behalten
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^build-' | tail -n +6 | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag
          done

      - name: Auf den Server ausrollen (SSH)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          exec > >(tee -a "$RUNNER_TEMP/log.txt") 2>&1
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::notice::Keine Secrets DEPLOY_SSH_* hinterlegt – Ausrollen übersprungen (Release $TAG liegt bereit)."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -p "${SSH_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ConnectTimeout=20 \
              "backstage@$SSH_HOST" "deploy $TAG" < backstage-runtime.tar.gz
          rm -f ~/.ssh/deploy

      - name: Fehlerausgabe als Annotation (lesbar über die API)
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/log.txt" ] || exit 0
          # Annotationen werden gekürzt – darum: erst die Fehlerzeilen, dann das Ende, in Stücken zu höchstens 3000 Zeichen
          L="$RUNNER_TEMP/log.txt"; C="$RUNNER_TEMP/kurz.txt"
          { echo "== Fehlerzeilen"; sed 's/\x1b\[[0-9;]*m//g' "$L" | grep -E 'YN000[1-9]|YN00[1-9][0-9].*(rror|fail)|[Ee]rror|ERR!|failed|Exit code' | grep -v 'YN0060' | tail -n 25
            echo "== Ende"; sed 's/\x1b\[[0-9;]*m//g' "$L" | tail -n 15; } | cut -c1-300 > "$C"
          n=1; buf=""
          while IFS= read -r line; do
            if [ $(( ${#buf} + ${#line} )) -gt 3000 ] && [ $n -lt 5 ]; then
              echo "::error title=Letzte Ausgabe ${n}::$(printf '%s' "$buf" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; n=$((n+1)); buf=""
            fi
            buf="${buf}${line}"$'\n'
          done < "$C"
          [ -n "$buf" ] && echo "::error title=Letzte Ausgabe ${n}::$(printf '%s' "$buf" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
