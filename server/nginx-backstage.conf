# Backstage hinter nginx. Platzhalter __DOMAIN__ und __GATE__ setzt install.sh.
# Schutz: Die Seite fragt einmal nach Benutzer/Passwort und setzt dabei ein geheimes Cookie.
# Die API-Pfade lässt nginx nur mit diesem Cookie durch – Basic-Auth allein geht nicht,
# weil Backstage bei API-Aufrufen ein eigenes Authorization-Feld schickt.
map $cookie_portal_gate $backstage_gate_ok {
    default    0;
    "__GATE__" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 20m;

    location /api/ {
        if ($backstage_gate_ok = 0) { return 401; }
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }

    location / {
        auth_basic "Anderheyden Portal";
        auth_basic_user_file /etc/nginx/backstage.htpasswd;
        add_header Set-Cookie "portal_gate=__GATE__; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Strict" always;
        proxy_pass http://127.0.0.1:7007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
